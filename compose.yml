services:
  today-rice:
    build:
      context: .
    restart: unless-stopped
    expose:
      - "8009"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8009/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - mvtp-web-net

networks:
  mvtp-web-net:
    external: true
